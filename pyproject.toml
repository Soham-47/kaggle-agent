[project]
name = "kaggle-agent"
version = "0.1.0"
description = "Self-healing Kaggle competition agent (pilot: RSNA Knee)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "kaggle>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kaggle-agent = "kaggle_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: hits live Kaggle API (needs ~/.kaggle/kaggle.json)",
]
