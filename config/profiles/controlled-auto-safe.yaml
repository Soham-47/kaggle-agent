# Explicit operator opt-in for a bounded, higher-autonomy AUTO_SAFE rollout.
# This fragment is never loaded by default. Use:
#   kaggle-agent supervisor --profile controlled-auto-safe --competition <id>
# Only after reviewing the disposable state root and operational safeguards.

supervisor:
  enabled: true
  mode: auto_safe
  repair:
    enabled: true
    classification_min_confidence: 0.80
    max_attempts_per_incident: 3
    max_repairs_per_cycle: 5
    max_repairs_per_day: 20
    max_changed_source_files: 8
    max_changed_test_files: 1
    max_changed_lines: 500
    allow_dependency_changes: false
    require_spec_review: true
    require_code_review: true
    require_full_tests: true
  promotion:
    automatic: true
  protected:
    strict: true
  auto_safe:
    enabled: true
    policy: risk_adaptive
    global_hard_ceiling:
      max_source_files: 12
      max_test_files: 6
      max_changed_lines: 1000
    profiles:
      low:
        automatic_promotion: true
        allow_candidate_generation: true
        max_source_files: 4
        max_test_files: 2
        max_changed_lines: 250
        max_attempts: 2
        required_reproduction_strength: STATIC_REPRO
      medium:
        automatic_promotion: true
        allow_candidate_generation: true
        max_source_files: 8
        max_test_files: 4
        max_changed_lines: 600
        max_attempts: 2
        required_reproduction_strength: STATIC_REPRO
        require_full_tests: true
      high:
        automatic_promotion: false
        allow_candidate_generation: true
        max_source_files: 12
        max_test_files: 6
        max_changed_lines: 1000
        max_attempts: 2
        required_reproduction_strength: EXISTING_DETERMINISTIC_TEST
      prohibited:
        automatic_promotion: false
        allow_candidate_generation: false
        max_source_files: 0
        max_test_files: 0
        max_changed_lines: 0
        max_attempts: 0
